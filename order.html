<script>
// Fungsi untuk membaca data yang dikirim dari halaman tema atau harga
window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const selectedTema = urlParams.get('tema');
    const selectedHarga = urlParams.get('harga');

    // Jika ada data tema di URL, tampilkan atau pilih secara otomatis di form
    if (selectedTema) {
        console.log("Tema terpilih: " + selectedTema);
        // Anda bisa membuat elemen di form order.html untuk menampilkan teks tema terpilih
        const infoTema = document.getElementById('info-tema-terpilih');
        if (infoTema) {
            infoTema.innerText = "Tema Pilihan: " + selectedTema.toUpperCase();
        }
    }

    // Jika ada data harga di URL, tampilkan di ringkasan pembayaran
    if (selectedHarga) {
        const formatRupiah = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(selectedHarga);
        const infoHarga = document.getElementById('info-harga-terpilih');
        if (infoHarga) {
            infoHarga.innerText = "Total Harga: " + formatRupiah;
        }
    }
});
</script>
